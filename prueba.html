<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Seguro</title>

<style>
  body{
    margin:0;
    font-family: Arial;
    height:100vh;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    padding-left:80px;
    position:relative;

    background: url("xa.gif") no-repeat center center fixed;
    background-size: cover;
    overflow:hidden;
  }

  body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;

    background: linear-gradient(
      to right,
      rgba(0,0,0,0.85),
      rgba(0,0,0,0.4),
      rgba(0,0,0,0)
    );
  }

  .box{
    position:relative;
    z-index:1;

    width:320px;
    padding:30px;
    border-radius:15px;
    text-align:center;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.25);

    transition:0.4s;
  }

  h2{
    color:white;
    margin-bottom:15px;
  }

  input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:10px 0;

    border-radius:12px;
    border:1px solid rgba(255,255,255,0.3);

    background: rgba(255,255,255,0.15);
    color:white;

    outline:none;
  }

  input::placeholder{
    color:#ddd;
  }

  #msg{
    color:red;
    font-size:14px;
  }

  /* 🔥 BOTÓN CENTRADO OCULTO */
  #finalBtn{
    display:none;

    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    padding:18px 60px;
    border-radius:50px;

    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);

    color:white;
    font-size:18px;
    cursor:pointer;

    backdrop-filter: blur(18px);
    transition:0.3s;
  }

  #finalBtn:hover{
    transform:translate(-50%,-50%) scale(1.1);
  }

</style>
</head>

<body>

<div class="box" id="box">

  <h2>Iniciar Sesión</h2>

  <input type="email" id="email" placeholder="Correo" oninput="checkFields()">
  <input type="password" id="password" placeholder="Contraseña" oninput="checkFields()">

  <p id="msg"></p>

</div>

<button id="finalBtn" onclick="login()">INGRESAR</button>

<script>

function validarEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validarPassword(pass){
  return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$/.test(pass);
}

function checkFields(){

  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  let box = document.getElementById("box");
  let btn = document.getElementById("finalBtn");
  let msg = document.getElementById("msg");

  msg.innerText = "";

  // ❌ si está vacío
  if(email === "" || password === ""){
    btn.style.display = "none";
    box.style.display = "block";
    return;
  }

  // ❌ email inválido
  if(!validarEmail(email)){
    msg.innerText = "Correo inválido";
    btn.style.display = "none";
    box.style.display = "block";
    return;
  }

  // ❌ contraseña débil
  if(!validarPassword(password)){
    msg.innerText = "Contraseña débil (min 8, mayus, minus, número)";
    btn.style.display = "none";
    box.style.display = "block";
    return;
  }

  // 🔥 TODO OK → desaparecer caja + mostrar botón
  box.style.display = "none";
  btn.style.display = "block";
}

function login(){
  window.location.href = "https://www.youtube.com/@Fandelgaming108";
}

</script>

</body>
</html>
